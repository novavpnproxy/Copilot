<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>پنل مدیریت NOVA VPN</title>
  <style>
    :root{color-scheme:dark;--bg:#091321;--panel:#101d2e;--accent:#35d0ba;--muted:#a8b4c4}*{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:#f5f7fb;font:15px system-ui,sans-serif}main{max-width:980px;margin:32px auto;padding:16px}
    .card{background:var(--panel);border:1px solid #26384d;border-radius:16px;padding:20px;margin:16px 0}h1,h2{margin-top:0}
    label{display:block;margin:12px 0 5px;color:var(--muted)}input,select,textarea,button{font:inherit;border-radius:8px;padding:10px;border:1px solid #38506a;background:#091321;color:white;width:100%}
    textarea{min-height:110px;direction:ltr;text-align:left}button{background:var(--accent);color:#06151a;font-weight:700;cursor:pointer;margin-top:12px;border:0}
    button.secondary{background:#26384d;color:white}button.danger{background:#9e3b50;color:white}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
    .server{padding:14px 0;border-bottom:1px solid #26384d}.server:last-child{border:0}.meta{color:var(--muted);font-size:13px;overflow-wrap:anywhere}.actions{display:flex;gap:8px}.actions button{width:auto}.hidden{display:none}.notice{color:#ffd27c;line-height:1.6}
  </style>
</head>
<body><main>
  <h1>NOVA VPN — مدیریت سرورها</h1>
  <section id="login" class="card"><h2>ورود مدیر</h2><p class="meta">این پنل را فقط روی HTTPS و از دستگاه مورداعتماد استفاده کنید.</p>
    <label>نام کاربری</label><input id="username" autocomplete="username">
    <label>رمز عبور</label><input id="password" type="password" autocomplete="current-password">
    <button id="loginButton">ورود</button><p id="loginError" role="alert"></p></section>
  <section id="dashboard" class="hidden">
    <p class="notice">اطلاعات مکان فقط وقتی برای کاربران نمایش داده می‌شود که مدیر «موقعیت تأییدشده» را فعال کند. وضعیت آنلاین در این نسخه ادعا نمی‌شود.</p>
    <section class="card"><div class="row"><h2>سرورها</h2><button class="secondary" id="refresh">به‌روزرسانی</button></div><div id="servers"></div></section>
    <section class="card"><h2 id="formTitle">افزودن سرور</h2><form id="serverForm">
      <input id="serverId" type="hidden"><div class="row">
      <div><label>نام نمایشی</label><input id="name" required maxlength="80" placeholder="مثلاً Server 1"></div>
      <div><label>پروتکل</label><select id="protocol"><option>VLESS</option><option>VMESS</option><option>TROJAN</option><option>SHADOWSOCKS</option><option>HYSTERIA2</option><option>HYSTERIA</option></select></div>
      <div><label>کد کشور ISO (فقط با مکان تأییدشده)</label><input id="countryCode" maxlength="2" placeholder="DE"></div>
      <div><label>نام کشور فارسی</label><input id="countryFa" maxlength="80"></div><div><label>نام کشور انگلیسی</label><input id="countryEn" maxlength="80"></div></div>
      <label><input id="locationVerified" type="checkbox" style="width:auto"> موقعیت کشور را مستقل و معتبر بررسی کرده‌ام</label>
      <label><input id="enabled" type="checkbox" style="width:auto"> فعال برای کاربران</label>
      <label>پروفایل / کانفیگ خام (فقط مدیر؛ در فهرست عمومی برگردانده نمی‌شود)</label><textarea id="config" required autocomplete="off" spellcheck="false"></textarea>
      <div class="actions"><button type="submit">ذخیره</button><button type="button" class="secondary" id="clearForm">پاک‌کردن فرم</button></div>
    </form><p id="formMessage" role="status"></p></section>
    <button id="logout" class="secondary">خروج مدیر</button>
  </section>
</main>
<script>
'use strict';
const tokenKey='nova_admin_token';let token=sessionStorage.getItem(tokenKey);
const $=id=>document.getElementById(id);const api=async(path,options={})=>{const headers={...(options.body?{'Content-Type':'application/json'}:{}),...(token?{Authorization:`Bearer ${token}`}:{})};const response=await fetch(path,{...options,headers:{...headers,...options.headers}});if(response.status===401){logout();throw Error('نشست پایان یافته؛ دوباره وارد شوید.')}if(!response.ok){let msg=`خطا (${response.status})`;try{msg=(await response.json()).detail||msg}catch{}throw Error(msg)}return response.status===204?null:response.json()};
function showDashboard(on){$('login').classList.toggle('hidden',on);$('dashboard').classList.toggle('hidden',!on)}
function logout(){token=null;sessionStorage.removeItem(tokenKey);showDashboard(false)}
$('loginButton').onclick=async()=>{ $('loginError').textContent='';try{const result=await fetch('/api/v1/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value,password:$('password').value})});if(!result.ok)throw Error('ورود ناموفق');token=(await result.json()).access_token;sessionStorage.setItem(tokenKey,token);$('password').value='';showDashboard(true);await loadServers()}catch(e){$('loginError').textContent=e.message}};
function clearForm(){ $('serverForm').reset();$('serverId').value='';$('formTitle').textContent='افزودن سرور';$('formMessage').textContent=''}
$('clearForm').onclick=clearForm;$('logout').onclick=logout;$('refresh').onclick=loadServers;
async function loadServers(){try{const result=await api('/api/v1/admin/servers');const root=$('servers');root.replaceChildren();if(!result.servers.length){root.textContent='هنوز هیچ سروری ثبت نشده است.';return}for(const server of result.servers){const box=document.createElement('article');box.className='server';const title=document.createElement('strong');title.textContent=`${server.name} · ${server.protocol}`;const details=document.createElement('div');details.className='meta';details.textContent=`${server.enabled?'فعال':'غیرفعال'} · ${server.location_verified?(server.country_name_fa||server.country_code):'موقعیت نامشخص'} · به‌روزرسانی: ${server.updated_at}`;const actions=document.createElement('div');actions.className='actions';const edit=document.createElement('button');edit.className='secondary';edit.textContent='ویرایش';edit.onclick=()=>editServer(server.id);const remove=document.createElement('button');remove.className='danger';remove.textContent='حذف';remove.onclick=()=>deleteServer(server.id);actions.append(edit,remove);box.append(title,details,actions);root.append(box)}}catch(e){$('servers').textContent=e.message}}
async function editServer(id){try{const s=await api(`/api/v1/admin/servers/${encodeURIComponent(id)}`);$('serverId').value=s.id;$('name').value=s.name;$('protocol').value=s.protocol;$('countryCode').value=s.country_code||'';$('countryFa').value=s.country_name_fa||'';$('countryEn').value=s.country_name_en||'';$('locationVerified').checked=s.location_verified;$('enabled').checked=s.enabled;$('config').value=s.config;$('formTitle').textContent='ویرایش سرور';window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}catch(e){$('formMessage').textContent=e.message}}
async function deleteServer(id){if(!confirm('این سرور حذف شود؟'))return;try{await api(`/api/v1/admin/servers/${encodeURIComponent(id)}`,{method:'DELETE'});await loadServers()}catch(e){alert(e.message)}}
$('serverForm').onsubmit=async event=>{event.preventDefault();$('formMessage').textContent='در حال ذخیره…';const payload={name:$('name').value,protocol:$('protocol').value,country_code:$('countryCode').value||null,country_name_fa:$('countryFa').value||null,country_name_en:$('countryEn').value||null,location_verified:$('locationVerified').checked,enabled:$('enabled').checked,config:$('config').value};const id=$('serverId').value;try{await api(id?`/api/v1/admin/servers/${encodeURIComponent(id)}`:'/api/v1/admin/servers',{method:id?'PUT':'POST',body:JSON.stringify(payload)});$('formMessage').textContent='ذخیره شد.';clearForm();await loadServers()}catch(e){$('formMessage').textContent=e.message}};
if(token){showDashboard(true);loadServers()}else showDashboard(false);
</script></body></html>
