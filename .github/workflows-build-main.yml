- احراز هویت مدیر
- محافظت از اطلاعات حساس
- ارتباط امن HTTPS

توکن GitHub و رمز پنل مدیریت نباید داخل فایل APK قرار بگیرند.

کانفیگ‌هایی که داخل APK ذخیره می‌شوند قابل استخراج هستند؛ بنابراین راهکار نهایی باید مدیریت امن کانفیگ‌ها از طریق Backend باشد.

