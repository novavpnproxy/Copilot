۱۲. خروجی نهایی مورد انتظار

پروژه باید شامل دو محصول مستقل و متصل به یکدیگر باشد:

محصول اول: اپلیکیشن Nova VPN برای کاربران عادی

یک اپلیکیشن اندروید واقعی، حرفه‌ای و ساده که کاربران فقط کشور، سرور و دکمه اتصال و قطع اتصال را مشاهده کنند.

محصول دوم: پنل مدیریت اختصاصی برای مدیر Nova VPN

یک پنل مدیریتی امن که مدیر بتواند تمام کشورها، سرورها و کانفیگ‌ها را اضافه، حذف، ویرایش، فعال، غیرفعال و جایگزین کند.

هدف نهایی، ساخت یک VPN کاربردی با مدیریت متمرکز سرورها و مدل درآمدی مبتنی بر تبلیغات است.

تمام توسعه باید روی مخزن فعلی GitHub و پروژه موجود ادامه پیدا کند. از شروع مجدد پروژه، ساخت گزینه‌های نمایشی و اتلاف وقت با بررسی‌های تکراری خودداری شود.  و این که یک لینک جدا از اپ باید ساخته سود که زمان تغییر کانفینگ ها و پروکسی ها  مجبور به انتشار مجدد اپ نشویم ، یعنی کاربر با یک قطع اتصال و اتصال مجدد کانفینگ ها برایش به روز رسانی شود و این لینک باید از اپ جدا ساخته شود و توسط مدیر یا مالک اپ انحام شود و در اپلیکیشن کاربران هیچ کانفینگی یا پروکسی را نبینند و فقط با زدن یک دکمه اتصال ، وی پی ان شروع به متصل شدن شود و لطفا همه ساختار را واقعی بساز و اصلا آزمایشی چیزی نساز   
