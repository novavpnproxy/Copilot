۶. Backend و سیستم مدیریت اطلاعات

ساخت یک Backend و API امن برای ارتباط بین اپلیکیشن و پنل مدیریت.

معماری موردنظر:

پنل مدیریت ← Backend/API ← اپلیکیشن Nova VPN ← موتور VPN اندروید

قابلیت‌ها:

- دریافت فهرست کشورها
- دریافت فهرست سرورها
- دریافت اطلاعات کانفیگ‌ها به‌صورت امن
